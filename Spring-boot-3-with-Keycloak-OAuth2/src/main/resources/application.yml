
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/eternal
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

server:
  port: 8083

jwt:
  auth:
    converter:
      resource-id: eternal
      principle-attribute: preferred_username

logging:
  level:
    org.keycloak: DEBUG